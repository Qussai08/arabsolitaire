name: Mobile Build

on:
  push:
    branches: [main, master, 'release/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build environment'
        required: true
        default: 'staging'
        type: choice
        options: [dev, test, staging, prod]

jobs:
  android-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        flavor: [dev, staging]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Codegen (Drift)
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Android App Bundle (${{ matrix.flavor }})
        working-directory: apps/mobile
        run: |
          flutter build appbundle \
            --flavor ${{ matrix.flavor }} \
            -t lib/main_${{ matrix.flavor }}.dart \
            --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}-aab
          path: apps/mobile/build/app/outputs/bundle/**/*.aab
          retention-days: 14

  # iOS build requires macOS runner — enable when budget allows.
  # ios-build:
  #   name: iOS build
  #   runs-on: macos-latest
  #   ...
