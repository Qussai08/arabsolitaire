name: Firebase Rules Tests

on:
  pull_request:
  push:
    branches: [main, master]
    paths:
      - 'firebase/rules/**'
      - '.github/workflows/firebase-rules-test.yml'

jobs:
  rules-test:
    name: Firestore & Storage rules security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase/package-lock.json

      - name: Install Firebase deps
        working-directory: firebase
        run: npm ci

      - name: Setup Java (required for Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests (emulator)
        working-directory: firebase
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-arabsolitaire \
            "npm run rules:test"
